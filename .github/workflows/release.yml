name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos-arm64
          - macos-intel
      draft:
        description: 'Publish as draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            os: windows-latest
            name: Windows x64 (.exe)
            arch: x64
            target: win
          - id: macos-arm64
            os: macos-latest
            name: macOS Apple Silicon (.dmg)
            arch: arm64
            target: mac
          - id: macos-intel
            os: macos-15-intel
            name: macOS Intel (.dmg)
            arch: x64
            target: mac

    steps:
      - name: Check selected platform
        id: filter
        shell: bash
        run: |
          selected="${{ github.event.inputs.platform || 'all' }}"
          if [ "$selected" = "all" ] || [ "$selected" = "${{ matrix.id }}" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.run_build == 'true'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.run_build == 'true'
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        if: steps.filter.outputs.run_build == 'true'
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.filter.outputs.run_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install Node dependencies
        if: steps.filter.outputs.run_build == 'true'
        run: npm ci || npm install

      - name: Build Python Backend
        if: steps.filter.outputs.run_build == 'true'
        run: npm run build:backend

      - name: Build Desktop Application (${{ matrix.target }} - ${{ matrix.arch }})
        if: steps.filter.outputs.run_build == 'true'
        run: |
          npm run build:frontend
          npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload binaries to GitHub Release
        if: steps.filter.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.draft || false }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest.yml
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

  notify_telegram:
    name: Notify Telegram
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Telethon
        run: pip install telethon requests

      - name: Run Upload Script
        run: python scripts/tg_upload.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_INVITE_LINK: ${{ secrets.TELEGRAM_INVITE_LINK }}
