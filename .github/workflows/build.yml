name: Build Draft Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REPOSITORY: ${{ github.repository }}

on:
  push:
    tags:
      - 'build-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_draft_release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          TAG_NAME="${GITHUB_REF_NAME:-test-build}"
          if [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="build-$(date +'%Y%m%d%H%M%S')"
          fi
          if gh release view "$TAG_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release for $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --title "Test build $TAG_NAME" \
              --notes "Automated draft build for $TAG_NAME." \
              --draft \
              --prerelease \
              --latest=false
          fi

  build_windows_x64:
    name: Build Windows x64
    needs: create_draft_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          architecture: 'x64'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm install

      - name: Build Python Backend
        run: npm run build:backend

      - name: Build Windows Installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Windows assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.exe.blockmap' -o -name 'latest.yml' \) -print0)

          test "$(printf '%s\n' "${files[@]}" | grep -cE '\.exe$')" -ge 1
          test "$(printf '%s\n' "${files[@]}" | grep -cE '/latest\.yml$')" -eq 1

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$RELEASE_REPOSITORY" --clobber

  build_mac_intel:
    name: Build macOS Intel
    needs: create_draft_release
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm install

      - name: Build Python Backend
        run: npm run build:backend

      - name: Build Mac Intel
        run: npm run build:frontend && npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Mac Intel assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          version="$(node -p "require('./package.json').version")"
          x64_dmg="$(find dist -maxdepth 1 -type f -name '*-x64.dmg' -print -quit)"
          test -n "$x64_dmg"
          cp "$x64_dmg" "dist/Stasher-${version}-x64.dmg"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name '*-x64.dmg' -o -name '*-x64.zip' -o -name '*-x64*.blockmap' -o -name "Stasher-${version}-x64.dmg" \) -print0)

          test "$(printf '%s\n' "${files[@]}" | grep -cE -- '-x64\.dmg$')" -ge 1

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$RELEASE_REPOSITORY" --clobber

  build_mac_arm64:
    name: Build macOS ARM
    needs: create_draft_release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm install

      - name: Build Python Backend
        run: npm run build:backend

      - name: Build Mac ARM64
        run: npm run build:frontend && npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Mac ARM64 assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name '*-arm64.dmg' -o -name '*-arm64.zip' -o -name '*-arm64*.blockmap' -o -name 'latest-mac.yml' \) -print0)

          test "$(printf '%s\n' "${files[@]}" | grep -cE -- '-arm64\.dmg$')" -eq 1
          test "$(printf '%s\n' "${files[@]}" | grep -cE -- '-arm64\.zip$')" -eq 1
          test "$(printf '%s\n' "${files[@]}" | grep -cE '/latest-mac\.yml$')" -eq 1

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$RELEASE_REPOSITORY" --clobber
